# Profils actifs : base PostgreSQL + couche d'acces Spring Data JPA
spring.profiles.active=postgres,spring-data-jpa

server.port=9966
server.servlet.context-path=/petclinic/

spring.sql.init.schema-locations=classpath*:db/${spring.sql.init.platform}/schema.sql
spring.sql.init.data-locations=classpath*:db/${spring.sql.init.platform}/data.sql

spring.messages.basename=messages/messages
spring.jpa.open-in-view=false

logging.level.org.springframework=INFO

# ------------------------------------------------
# Securite
# true  = authentification par jeton JWT (POST /api/auth/login) + controle des roles
# false = toutes les routes sont ouvertes, sans authentification
# ------------------------------------------------
petclinic.security.enable=true

# Cle secrete HMAC-SHA256 qui signe les jetons : au moins 32 caracteres.
# En dehors du developpement, la fournir via la variable d'environnement JWT_SECRET.
petclinic.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
# Duree de validite d'un jeton, en minutes
petclinic.jwt.expiration-minutes=60
